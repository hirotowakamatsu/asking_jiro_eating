<!doctype html>
<html>
<head>

<title>伊賀君に二郎行くか聞き続けるwebページ</title>

<meta charset="UTF-8">
  <title>画面中央に表示</title>
  <style>
    /* 画面全体を使って中央寄せ */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    .center-box {
      display: flex;               /* Flexbox レイアウト */
      flex-direction: column;      /* 縦積み */
      justify-content: center;     /* 垂直方向中央寄せ */
      align-items: center;         /* 水平方向中央寄せ */
      height: 100%;                /* 画面いっぱい */
      background: #f5f5f5;         /* 背景色（お好みで） */
    }
    .center-box h1 {
      margin: 0 0 20px;
      font-size: 3rem;             /* 文字サイズ */
      color: #333;
    }
    .center-box img {
      max-width: 80%;              /* 画面幅の80%まで拡大 */
      height: auto;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
  </style>
<body>
<header>
<div class="container">
</div><!-- /.container -->
</header>
<main>
<div class="container">
<section>
    <div class="center-box">
        <h1>ありがとう</h1>
        <img src="34623b640e0d-1ea5-46f6-8cdd-8e90c7b1aee5_m.jpg">
    </div>
</section>
</div><!-- /.container -->
</main>
<footer>
<div class="container">
<p>JavaScript Samples</p>
</div><!-- /.container -->
</footer>

}

</script>
</body>
</html>
